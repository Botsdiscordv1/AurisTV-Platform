name: Build Flutter APK

on:
  push:
    branches: []
    tags:
      - 'v*' # Se activa EXCLUSIVAMENTE al crear un tag como v1.0.0

jobs:
  build:
    name: Build Android APKs (Split by ABI)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para borrar y crear la Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix Gradle Java Home for CI
        run: |
          sed -i '/org.gradle.java.home/d' Movil/android/gradle.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Build Split APKs Release
        run: |
          cd Movil
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Delete existing GitHub release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X DELETE \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} || true

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Movil/build/app/outputs/flutter-apk/*release.apk
          body_path: RELEASE_NOTES.md
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
