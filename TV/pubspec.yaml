publish_to: 'none'
version: 1.1.3+14

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LÓGICA COMPARTIDA
  auris_sdk:
    path: E:/Auris_Projects/AurisSDK/auris_sdk

  # Reproductor de video nativo
  media_kit: ^1.1.11
  audio_service: ^0.18.18
  audio_session: ^0.1.21

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0