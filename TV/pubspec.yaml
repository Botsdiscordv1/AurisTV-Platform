name: auris_tv
description: "Android TV UI package for AurisMusic referencing auris_core."
publish_to: 'none'
version: 1.1.3+14

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LÓGICA COMPARTIDA (Paquete Local)
  auris_core:
    path: ../Core/packages/auris_core

  # Dependencias adicionales usadas en TV
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  permission_handler: ^11.0.0
  fullscreen_window: ^1.2.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  flutter_riverpod: ^2.5.1
  go_router: ^17.3.0
  material_symbols_icons: ^4.1.2

flutter:
  assets:
    - assets/branding/
    - assets/data/
    - assets/fonts/
    - assets/fonts/netflix_sans/
    - assets/icons/
    - assets/images/
    - assets/intro/