name: auris_web_desktop
description: "Shared Web and Native Desktop UI package for AurisMusic referencing auris_core and media_kit."
publish_to: 'none'
version: 1.1.5+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LÓGICA COMPARTIDA
  auris_core:
    path: ../Core/packages/auris_core

  # Red / API
  dio: ^5.9.2
  http: ^1.2.2
  socket_io_client: ^3.1.2
  supabase_flutter: ^2.6.0
  connectivity_plus: ^6.1.4

  # Reproducción (audio, video, live)
  audio_service: ^0.18.18
  audio_session: any
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  youtube_explode_dart: ^2.2.0
  youtube_player_iframe: ^5.1.2

  # Persistencia / Sesión
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  uuid: ^4.6.0

  # Web/Desktop extras
  skeletonizer: ^3.0.0
  volume_controller: ^3.7.1
  webview_win_floating: ^3.0.3
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  fullscreen_window: ^1.2.1

  # Google Fonts
  google_fonts: ^6.2.1
  go_router: ^17.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/data/
    - assets/icons/
    - assets/images/
    - assets/intro/
    - assets/avatars/animes/dandadan/
    - assets/avatars/animes/kusuriya_no_hitorigoto/
    - assets/avatars/animes/sakamoto_days/
    - assets/avatars/animes/seihantai_na_kimi_to_boku/
    - assets/avatars/animes/yofukashi_no_uta/