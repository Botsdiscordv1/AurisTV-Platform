<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AurisTV — Tu plataforma personal de entretenimiento.">
  <link rel="canonical" href="https://auristv.dpdns.org/" />

  <!-- SEO / OpenGraph (taste-skill: share tags + theme-color) -->
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="theme-color" content="#EF7A1E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AurisTV">
  <meta property="og:description" content="AurisTV — Tu plataforma personal de entretenimiento.">
  <meta property="og:image" content="https://auristv.dpdns.org/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="AurisTV">
  <meta property="og:url" content="https://auristv.dpdns.org/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AurisTV">
  <meta name="twitter:description" content="AurisTV — Tu plataforma personal de entretenimiento.">
  <meta name="twitter:image" content="https://auristv.dpdns.org/share.jpg">

  <!-- Fuentes Netflix Sans (TTF empaquetados por Flutter; preload + swap para
       evitar FOUT en el loader antes de que Flutter cargue) -->
  <link rel="preload" as="font" href="assets/packages/auris_core/assets/fonts/netflix_sans/NetflixSans-Regular.ttf" type="font/ttf" crossorigin>
  <link rel="preload" as="font" href="assets/packages/auris_core/assets/fonts/netflix_sans/NetflixSans-Bold.ttf" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: 'NetflixSans';
      font-style: normal;
      font-weight: 400;
      src: url('assets/packages/auris_core/assets/fonts/netflix_sans/NetflixSans-Regular.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'NetflixSans';
      font-style: normal;
      font-weight: 700;
      src: url('assets/packages/auris_core/assets/fonts/netflix_sans/NetflixSans-Bold.ttf') format('truetype');
      font-display: swap;
    }
    body { font-family: 'NetflixSans', sans-serif; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AurisTV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AurisTV</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
